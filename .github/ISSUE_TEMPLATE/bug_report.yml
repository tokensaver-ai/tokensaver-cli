name: Bug report
description: Something broke in the tokensaver CLI
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Include versions and redact API keys (`ts_…`).
  - type: input
    id: version
    attributes:
      label: CLI version
      placeholder: "tokensaver --version or pip show tokensaver-cli"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows
        - Other
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        tokensaver login
        tokensaver route claude --launch
        ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / doctor output
      description: Output of `tokensaver doctor --claude` (redact secrets)
