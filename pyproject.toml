[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokensaver-cli"
dynamic = ["version"]
description = "TokenSaver CLI — route AI agents (Claude Code, Cursor, Codex) through the control plane"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "TokenSaver" }]
keywords = ["tokensaver", "llm", "cli", "claude", "cursor", "mcp", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
tokensaver = "tokensaver_cli.main:main"

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://platform.tokensaver.fr"
Documentation = "https://github.com/tokensaver-ai/tokensaver-cli/tree/main/docs"
Repository = "https://github.com/tokensaver-ai/tokensaver-cli"
PyPI = "https://pypi.org/project/tokensaver-cli/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokensaver_cli = [
    "claude_plugin/**/*",
    "claude_plugin/.claude-plugin/*",
    "claude_plugin/.mcp.json",
    "claude_plugin/hooks/*",
    "claude_plugin/commands/*",
]

[tool.setuptools.dynamic]
version = { attr = "tokensaver_cli.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
